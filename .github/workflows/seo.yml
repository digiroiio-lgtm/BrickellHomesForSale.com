name: SEO and crawlability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:seo
      - run: npm run build
      - run: npm run typecheck
      - name: Audit rendered pages
        run: |
          npm run start > /tmp/brickell-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:indexing
